services:
  db:
    image: postgres:15-alpine
    container_name: airline-db
    environment:
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
      POSTGRES_DB: airline
    ports:
      - "5432:5432"
    volumes:
      - airline_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airline -d airline"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  airline_pgdata: